<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgBudin" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbf2"/>
      <stop offset="100%" stop-color="#f0dfcb"/>
    </radialGradient>
    <linearGradient id="loafCrumb" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcedc7"/>
      <stop offset="100%" stop-color="#e2c892"/>
    </linearGradient>
    <linearGradient id="crustBudin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9e5720"/>
      <stop offset="50%" stop-color="#693009"/>
      <stop offset="100%" stop-color="#8a4714"/>
    </linearGradient>
    <linearGradient id="icingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7f2ea"/>
    </linearGradient>
    <filter id="budinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#3c1d0b" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgBudin)"/>

  <!-- Plate -->
  <ellipse cx="150" cy="235" rx="105" ry="30" fill="#ffffff" filter="url(#budinShadow)"/>
  <ellipse cx="150" cy="235" rx="90" ry="24" fill="#faf6f0"/>

  <!-- Sliced Pound Cake (Budín) -->
  <g filter="url(#budinShadow)">
    <!-- Back loaf shape -->
    <path d="M 120 120 C 140 90, 220 100, 230 135 L 210 205 L 120 190 Z" fill="#75390e"/>
    
    <!-- Slice Front Face -->
    <path d="M 80 160 C 80 115, 170 105, 170 160 L 160 215 L 90 210 Z" fill="url(#loafCrumb)"/>
    <!-- Dark crust perimeter of slice -->
    <path d="M 80 160 C 80 115, 170 105, 170 160" stroke="#75390e" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 77 160 L 87 212" stroke="#75390e" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M 173 160 L 163 216" stroke="#75390e" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- Candied Seasonal Fruits inside crumb (arándanos, cáscaras de naranja) -->
    <circle cx="105" cy="155" r="4.5" fill="#301548"/>
    <circle cx="135" cy="140" r="5" fill="#301548"/>
    <circle cx="120" cy="180" r="4" fill="#301548"/>
    <circle cx="145" cy="190" r="4.5" fill="#301548"/>
    
    <!-- Candied orange/lemon bits -->
    <rect x="110" y="165" width="7" height="4" fill="#f57c00" rx="1"/>
    <rect x="138" y="160" width="6" height="5" fill="#f57c00" rx="1"/>
    <rect x="125" y="130" width="5" height="4" fill="#e65100" rx="1"/>
    <rect x="100" y="185" width="6" height="4" fill="#f57c00" rx="1"/>

    <!-- Sugar Glaze / Icing dripping from top -->
    <path d="M 115 110 Q 125 125 125 115 Q 135 130 135 118 Q 145 135 145 116 Q 160 128 165 115 L 160 108 C 140 100, 120 105, 115 110 Z" fill="url(#icingGrad)"/>
    <path d="M 134 118 Q 135 135 136 128" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>
    
    <!-- Fresh fruit garnish on top -->
    <circle cx="140" cy="100" r="6" fill="#c62828"/>
    <circle cx="150" cy="105" r="5" fill="#283593"/>
    <path d="M 148 95 C 158 90, 162 95, 158 102 Z" fill="#43a047"/>
  </g>
</svg>
