<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgCheese" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9f2"/>
      <stop offset="100%" stop-color="#f0e2d3"/>
    </radialGradient>
    <linearGradient id="crustGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b67a3d"/>
      <stop offset="100%" stop-color="#8c531b"/>
    </linearGradient>
    <linearGradient id="cheeseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffcee"/>
      <stop offset="100%" stop-color="#faecc8"/>
    </linearGradient>
    <linearGradient id="berrySauce" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b71c1c"/>
      <stop offset="100%" stop-color="#67000d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#421a08" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgCheese)"/>

  <!-- Plate -->
  <ellipse cx="150" cy="235" rx="105" ry="30" fill="#ffffff" filter="url(#shadow)"/>
  <ellipse cx="150" cy="235" rx="90" ry="24" fill="#faf6f0"/>

  <!-- Cheesecake Slice -->
  <g filter="url(#shadow)">
    <!-- Biscuit Crust Base -->
    <path d="M 75 190 L 195 210 L 235 170 L 115 155 Z" fill="url(#crustGrad)"/>
    <!-- Biscuit Back Edge -->
    <path d="M 75 190 L 75 178 L 115 143 L 115 155 Z" fill="#754110"/>
    
    <!-- Cheesecake Filling Side Left -->
    <path d="M 75 178 L 195 198 L 195 160 L 75 140 Z" fill="url(#cheeseGrad)"/>
    <!-- Cheesecake Filling Side Right -->
    <path d="M 195 198 L 235 158 L 235 120 L 195 160 Z" fill="#e8d4a9"/>
    <!-- Cheesecake Top Triangle -->
    <path d="M 75 140 L 195 160 L 235 120 L 115 105 Z" fill="#fffef7"/>
    
    <!-- Berry Coulis on top & dripping -->
    <path d="M 85 140 Q 140 148 190 156 Q 215 138 230 122 Q 180 112 120 110 Z" fill="url(#berrySauce)"/>
    <path d="M 110 144 C 110 162 118 165 118 152 C 118 144 140 150 140 162 C 140 170 146 168 146 154" fill="url(#berrySauce)"/>
    <circle cx="160" cy="172" r="3.5" fill="url(#berrySauce)"/>
    <circle cx="120" cy="175" r="2.5" fill="url(#berrySauce)"/>
    
    <!-- Fresh Raspberries & Blueberries -->
    <circle cx="145" cy="135" r="9" fill="#c62828"/>
    <circle cx="142" cy="132" r="2" fill="#ffcdd2" opacity="0.8"/>
    <circle cx="162" cy="138" r="8" fill="#ad1457"/>
    <circle cx="132" cy="142" r="7" fill="#283593"/>
    <circle cx="175" cy="130" r="6" fill="#1a237e"/>
    
    <!-- Mint sprig -->
    <path d="M 165 125 C 175 115 185 120 180 130 C 172 130 168 126 165 125 Z" fill="#43a047"/>
  </g>
</svg>
