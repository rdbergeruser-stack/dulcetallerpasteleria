<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="heroBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="60%" stop-color="#f5e8d8"/>
      <stop offset="100%" stop-color="#e8d5c0"/>
    </radialGradient>
    <linearGradient id="woodTable" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c49a6c"/>
      <stop offset="100%" stop-color="#8c5828"/>
    </linearGradient>
    <filter id="sceneShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2a1810" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#heroBg)"/>

  <!-- Rustic Wooden Table Base -->
  <path d="M 0 320 L 600 320 L 600 450 L 0 450 Z" fill="url(#woodTable)"/>
  <line x1="0" y1="320" x2="600" y2="320" stroke="#704218" stroke-width="3"/>
  <line x1="0" y1="360" x2="600" y2="360" stroke="#704218" stroke-width="1.5" opacity="0.4"/>
  <line x1="0" y1="410" x2="600" y2="410" stroke="#704218" stroke-width="1.5" opacity="0.4"/>

  <!-- Linen Napkin Cloth -->
  <polygon points="120,300 320,290 350,440 100,430" fill="#fdfbf7" opacity="0.85"/>

  <!-- Main Centerpiece: Gourmet Artisan Cake on Marble Pedestal -->
  <!-- Pedestal -->
  <ellipse cx="280" cy="350" rx="140" ry="30" fill="#2a1810" opacity="0.2"/>
  <ellipse cx="280" cy="335" rx="130" ry="25" fill="#f8f4ee" filter="url(#sceneShadow)"/>
  <path d="M 260 335 L 260 375 L 300 375 L 300 335 Z" fill="#ebe1d3"/>
  <ellipse cx="280" cy="375" rx="45" ry="12" fill="#d9cbba"/>

  <!-- The Cake -->
  <g filter="url(#sceneShadow)">
    <path d="M 170 240 C 170 210, 390 210, 390 240 L 390 310 C 390 340, 170 340, 170 310 Z" fill="#ffffff"/>
    <ellipse cx="280" cy="240" rx="110" ry="30" fill="#fdfbf7"/>
    <!-- Textured frosting ridges -->
    <path d="M 172 265 Q 280 295 388 265" stroke="#f0e2d1" stroke-width="8" fill="none"/>
    <path d="M 172 290 Q 280 320 388 290" stroke="#f0e2d1" stroke-width="8" fill="none"/>
    
    <!-- Berry Crown -->
    <!-- Strawberries, Blueberries, Figs -->
    <circle cx="240" cy="230" r="16" fill="#c62828"/>
    <circle cx="270" cy="225" r="18" fill="#ad1457"/>
    <circle cx="300" cy="228" r="15" fill="#c62828"/>
    <circle cx="325" cy="235" r="12" fill="#1a237e"/>
    <circle cx="220" cy="238" r="10" fill="#1a237e"/>
    <circle cx="255" cy="215" r="10" fill="#283593"/>
    <circle cx="285" cy="216" r="11" fill="#4a148c"/>
    <!-- Fresh Mint Sprigs & Rosemary -->
    <path d="M 290 210 Q 320 185 330 200 Q 310 215 290 210 Z" fill="#43a047"/>
    <path d="M 230 215 Q 210 190 200 205 Q 220 220 230 215 Z" fill="#43a047"/>
    <!-- Gold leaf flakes -->
    <polygon points="260,225 265,222 267,227 262,229" fill="#ffd700"/>
    <polygon points="295,232 300,230 302,235 297,236" fill="#ffd700"/>
  </g>

  <!-- Cup of Specialty Latte on Left -->
  <g transform="translate(60, 260) scale(0.65)" filter="url(#sceneShadow)">
    <ellipse cx="100" cy="140" rx="70" ry="20" fill="#ffffff"/>
    <path d="M 40 80 C 40 140, 160 140, 160 80 Z" fill="#f5ede2"/>
    <ellipse cx="100" cy="80" rx="55" ry="16" fill="#b87b40"/>
    <path d="M 100 85 C 90 75, 80 80, 90 90 C 100 98, 100 98, 100 98 C 100 98, 100 98, 110 90 C 120 80, 110 75, 100 85 Z" fill="#ffffff"/>
  </g>

  <!-- Croissant / Pastry on Right -->
  <g transform="translate(430, 290) scale(0.65)" filter="url(#sceneShadow)">
    <ellipse cx="100" cy="80" rx="75" ry="30" fill="#d9822b"/>
    <path d="M 30 80 Q 100 40 170 80 Q 100 110 30 80 Z" fill="#b35a15"/>
    <path d="M 50 75 Q 100 50 150 75" stroke="#ffe0a3" stroke-width="4" fill="none"/>
  </g>

  <!-- Ambient Steam / Warm Sunlight overlay -->
  <ellipse cx="280" cy="180" rx="180" ry="100" fill="#ffffff" opacity="0.15"/>
</svg>
