<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgLatte" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="100%" stop-color="#ecdcce"/>
    </radialGradient>
    <radialGradient id="latteBase" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c99765"/>
      <stop offset="70%" stop-color="#a46f3d"/>
      <stop offset="100%" stop-color="#69401b"/>
    </radialGradient>
    <linearGradient id="ceramicCup" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ded4c8"/>
      <stop offset="30%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f2ebe1"/>
      <stop offset="100%" stop-color="#cfc3b3"/>
    </linearGradient>
    <filter id="latteShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#3c1d0b" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgLatte)"/>

  <!-- Saucer -->
  <ellipse cx="150" cy="235" rx="100" ry="28" fill="#e2d8cb" filter="url(#latteShadow)"/>
  <ellipse cx="150" cy="232" rx="90" ry="22" fill="#ffffff"/>

  <!-- Cup Handle -->
  <path d="M 205 135 C 248 135, 248 185, 205 185" stroke="url(#ceramicCup)" stroke-width="14" stroke-linecap="round" fill="none" filter="url(#latteShadow)"/>

  <!-- Cup Body -->
  <g filter="url(#latteShadow)">
    <path d="M 75 125 C 75 220, 225 220, 225 125 Z" fill="url(#ceramicCup)"/>
    <!-- Rim -->
    <ellipse cx="150" cy="125" rx="75" ry="26" fill="#e8dfd3"/>
    <ellipse cx="150" cy="125" rx="68" ry="22" fill="#d9cdbf"/>
    
    <!-- Latte Coffee Surface -->
    <ellipse cx="150" cy="125" rx="64" ry="20" fill="url(#latteBase)"/>

    <!-- Silky Latte Art (Rosetta / Tulip Heart Foam) -->
    <!-- Base Heart -->
    <path d="M 150 135 C 130 115, 110 120, 125 138 C 138 152, 150 160, 150 160 C 150 160, 162 152, 175 138 C 190 120, 170 115, 150 135 Z" fill="#ffffff" opacity="0.95"/>
    
    <!-- Inner Heart 1 -->
    <path d="M 150 126 C 136 112, 122 116, 132 128 C 142 138, 150 144, 150 144 C 150 144, 158 138, 168 128 C 178 116, 164 112, 150 126 Z" fill="#ffffff"/>

    <!-- Top Heart Crown -->
    <path d="M 150 118 C 140 108, 130 111, 138 120 C 145 127, 150 132, 150 132 C 150 132, 155 127, 162 120 C 170 111, 160 108, 150 118 Z" fill="#ffffff"/>

    <!-- Center Drag Spine Line -->
    <path d="M 150 112 L 150 152" stroke="#a46f3d" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
</svg>
