<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgScone" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="100%" stop-color="#ecdcce"/>
    </radialGradient>
    <radialGradient id="sconeCrust" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffdfa4"/>
      <stop offset="40%" stop-color="#d99f57"/>
      <stop offset="85%" stop-color="#9e5a1b"/>
      <stop offset="100%" stop-color="#733b09"/>
    </radialGradient>
    <linearGradient id="jamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c62828"/>
      <stop offset="100%" stop-color="#6a0c0c"/>
    </linearGradient>
    <filter id="scShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#3c1d0b" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgScone)"/>

  <!-- Plate -->
  <ellipse cx="150" cy="235" rx="110" ry="30" fill="#ffffff" filter="url(#scShadow)"/>
  <ellipse cx="150" cy="235" rx="95" ry="24" fill="#faf6f0"/>

  <!-- Little Jam & Clotted Cream ramekin on side -->
  <g filter="url(#scShadow)" transform="translate(140, 160) scale(0.65)">
    <ellipse cx="60" cy="80" rx="35" ry="15" fill="#fdfbf7"/>
    <path d="M 25 80 L 30 110 L 90 110 L 95 80 Z" fill="#e8dfd3"/>
    <ellipse cx="60" cy="80" rx="32" ry="12" fill="url(#jamGrad)"/>
    <ellipse cx="50" cy="78" rx="14" ry="7" fill="#fffef7"/> <!-- Clotted cream dollop -->
  </g>

  <!-- Flaky Scones (Textura hojaldrada y sutil notas de manteca) -->
  <!-- Left Scone -->
  <g filter="url(#scShadow)">
    <path d="M 60 175 C 60 135, 140 130, 145 175 L 140 215 C 135 225, 65 225, 60 215 Z" fill="url(#sconeCrust)"/>
    <!-- Flaky Horizontal Split / Lamination Line in middle -->
    <path d="M 58 178 Q 100 170 148 180" stroke="#5a2c07" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 62 182 Q 100 190 145 183" stroke="#ffdca3" stroke-width="2" fill="none"/>
    <path d="M 75 150 Q 105 140 130 152" stroke="#5a2c07" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Right Scone (Overlapping) -->
  <g filter="url(#scShadow)">
    <path d="M 115 160 C 115 120, 200 115, 205 160 L 200 205 C 195 218, 120 218, 115 205 Z" fill="url(#sconeCrust)"/>
    <!-- Flaky Horizontal Split Line in middle -->
    <path d="M 113 165 Q 155 156 208 166" stroke="#5a2c07" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 116 169 Q 155 178 204 170" stroke="#ffdca3" stroke-width="2.5" fill="none"/>
    <path d="M 130 135 Q 160 125 190 138" stroke="#5a2c07" stroke-width="2" stroke-linecap="round" fill="none"/>
    
    <!-- Egg wash sheen on top -->
    <ellipse cx="160" cy="130" rx="25" ry="10" fill="#ffeac2" opacity="0.6"/>
  </g>
</svg>
