<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgTea" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbf0"/>
      <stop offset="100%" stop-color="#ecdcce"/>
    </radialGradient>
    <radialGradient id="teaLiquid" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e67e22"/>
      <stop offset="60%" stop-color="#b8580c"/>
      <stop offset="100%" stop-color="#733203"/>
    </radialGradient>
    <linearGradient id="glassWall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="teaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#3c1d0b" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgTea)"/>

  <!-- Saucer Glass -->
  <ellipse cx="150" cy="235" rx="95" ry="25" fill="#f5ede2" filter="url(#teaShadow)"/>
  <ellipse cx="150" cy="232" rx="85" ry="20" fill="#ffffff" opacity="0.9"/>

  <!-- Glass Cup Handle -->
  <path d="M 200 140 C 238 140, 238 190, 200 190" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8" filter="url(#teaShadow)"/>

  <!-- Glass Cup with Amber Infusion -->
  <g filter="url(#teaShadow)">
    <!-- Glass outer -->
    <path d="M 85 130 C 85 220, 215 220, 215 130 Z" fill="rgba(255, 255, 255, 0.4)"/>
    <!-- Liquid fill -->
    <path d="M 92 142 C 92 212, 208 212, 208 142 Z" fill="url(#teaLiquid)"/>
    <!-- Liquid top ellipse -->
    <ellipse cx="150" cy="142" rx="58" ry="17" fill="#f39c12"/>
    
    <!-- Botanical Whole Leaves Infusion (Té botánico en hebras) -->
    <!-- Leaf 1 -->
    <path d="M 125 155 C 115 140, 135 135, 140 150 C 138 160, 130 162, 125 155 Z" fill="#556b2f"/>
    <!-- Leaf 2 -->
    <path d="M 160 165 C 175 150, 185 165, 170 175 C 160 175, 155 170, 160 165 Z" fill="#6b8e23"/>
    <!-- Dried Rose Petal -->
    <path d="M 145 145 C 135 138, 150 132, 155 142 Z" fill="#c2185b" opacity="0.9"/>
    
    <!-- Glass Rim -->
    <ellipse cx="150" cy="130" rx="65" ry="20" fill="url(#glassWall)" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Glass Reflection Highlights -->
    <path d="M 96 145 C 96 195, 115 208, 115 208" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75"/>
    <ellipse cx="185" cy="155" rx="3" ry="10" fill="#ffffff" opacity="0.5"/>
  </g>
</svg>
