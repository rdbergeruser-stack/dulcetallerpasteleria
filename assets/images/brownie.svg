<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgBrownie" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8f3"/>
      <stop offset="100%" stop-color="#edd9cb"/>
    </radialGradient>
    <linearGradient id="chocCube" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e2716"/>
      <stop offset="50%" stop-color="#381b0e"/>
      <stop offset="100%" stop-color="#231008"/>
    </linearGradient>
    <linearGradient id="fudgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d1b0d"/>
      <stop offset="100%" stop-color="#220d04"/>
    </linearGradient>
    <filter id="chocShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#241006" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgBrownie)"/>

  <!-- Plate -->
  <ellipse cx="150" cy="235" rx="100" ry="28" fill="#ffffff" filter="url(#chocShadow)"/>
  <ellipse cx="150" cy="235" rx="85" ry="22" fill="#faf6f0"/>

  <!-- Brownie Cube -->
  <g filter="url(#chocShadow)">
    <!-- Top Face (Cracked glossy crust) -->
    <path d="M 150 100 L 225 135 L 150 170 L 75 135 Z" fill="#4a2617"/>
    <!-- Crust crack details -->
    <path d="M 120 125 Q 145 135 175 125 M 150 115 Q 160 140 140 155" stroke="#75432d" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M 95 135 Q 130 145 160 140" stroke="#33180c" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Left Face (Fudgy dense crumb) -->
    <path d="M 75 135 L 150 170 L 150 215 L 75 180 Z" fill="url(#fudgeGrad)"/>
    <!-- Right Face (Fudgy crumb) -->
    <path d="M 150 170 L 225 135 L 225 180 L 150 215 Z" fill="#1f0c05"/>

    <!-- Crumb textures & Walnut/Almond chunks -->
    <!-- Almond chunks on top -->
    <polygon points="135,115 145,110 150,118 138,122" fill="#d8ad7b"/>
    <polygon points="160,130 172,126 175,135 165,138" fill="#c79c6a"/>
    <polygon points="110,132 120,128 123,137 114,139" fill="#e8c297"/>
    <polygon points="175,142 188,138 190,146 180,149" fill="#d8ad7b"/>
    <polygon points="135,145 148,142 146,150 137,152" fill="#c79c6a"/>

    <!-- Melted Chocolate Drizzle -->
    <path d="M 90 135 Q 135 110 170 145 Q 190 120 215 150" stroke="#1d0a03" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 105 145 Q 145 130 185 160" stroke="#1d0a03" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="150" cy="205" r="3" fill="#1d0a03"/>
    <circle cx="95" cy="175" r="2.5" fill="#1d0a03"/>
  </g>
</svg>
