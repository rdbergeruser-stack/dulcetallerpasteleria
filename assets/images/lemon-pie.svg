<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgLemon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="100%" stop-color="#f5ecdc"/>
    </radialGradient>
    <linearGradient id="sableeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b87b3e"/>
      <stop offset="100%" stop-color="#8a531d"/>
    </linearGradient>
    <linearGradient id="lemonCurd" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe033"/>
      <stop offset="100%" stop-color="#f5b800"/>
    </linearGradient>
    <linearGradient id="meringuePeak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a06026"/>
      <stop offset="25%" stop-color="#deb887"/>
      <stop offset="60%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff9f0"/>
    </linearGradient>
    <filter id="lemonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4d3012" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgLemon)"/>

  <!-- Plate -->
  <ellipse cx="150" cy="235" rx="105" ry="30" fill="#ffffff" filter="url(#lemonShadow)"/>
  <ellipse cx="150" cy="235" rx="90" ry="24" fill="#faf7f2"/>

  <!-- Lemon Pie Slice -->
  <g filter="url(#lemonShadow)">
    <!-- Base Dough Sablée -->
    <path d="M 70 195 L 195 215 L 235 175 L 110 155 Z" fill="url(#sableeGrad)"/>
    <!-- Rim Crust -->
    <path d="M 70 195 L 70 185 L 110 145 L 110 155 Z" fill="#6d3e12"/>
    
    <!-- Lemon Curd Layer -->
    <path d="M 72 185 L 195 205 L 233 167 L 110 147 Z" fill="url(#lemonCurd)"/>
    <path d="M 72 185 L 195 205 L 195 190 L 72 170 Z" fill="#e6a800"/>
    <path d="M 195 205 L 233 167 L 233 152 L 195 190 Z" fill="#c48a00"/>

    <!-- Italian Meringue Fluffy Peaks with Torch Browning -->
    <!-- Front Meringue Swirls -->
    <path d="M 75 168 Q 95 130 115 155 Q 135 120 155 160 Q 175 135 195 175 Q 215 145 230 152 L 230 162 L 75 178 Z" fill="#ffffff"/>
    
    <!-- Torched Peaks -->
    <path d="M 100 140 C 100 120, 115 110, 118 95 C 122 110, 135 120, 135 140 Z" fill="url(#meringuePeak)"/>
    <path d="M 135 145 C 135 125, 150 115, 153 100 C 158 115, 170 125, 170 145 Z" fill="url(#meringuePeak)"/>
    <path d="M 165 140 C 165 125, 180 115, 185 105 C 190 120, 200 130, 200 150 Z" fill="url(#meringuePeak)"/>
    <path d="M 80 155 C 80 135, 92 130, 95 118 C 98 130, 105 140, 105 155 Z" fill="url(#meringuePeak)"/>
    
    <!-- Toast Highlights (Golden brown tips) -->
    <circle cx="118" cy="95" r="3.5" fill="#8d4b1a"/>
    <circle cx="153" cy="100" r="3.5" fill="#8d4b1a"/>
    <circle cx="185" cy="105" r="3" fill="#8d4b1a"/>

    <!-- Lemon Zest Twist -->
    <path d="M 140 92 Q 155 85 165 95 Q 160 105 175 100" stroke="#fbc02d" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
</svg>
