<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgEspresso" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="100%" stop-color="#eddac6"/>
    </radialGradient>
    <radialGradient id="crema" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#df9a48"/>
      <stop offset="40%" stop-color="#b66b24"/>
      <stop offset="85%" stop-color="#7a3e0f"/>
      <stop offset="100%" stop-color="#461e05"/>
    </radialGradient>
    <linearGradient id="cupCeramic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#422214"/>
      <stop offset="40%" stop-color="#5a3120"/>
      <stop offset="80%" stop-color="#3c1e11"/>
      <stop offset="100%" stop-color="#241008"/>
    </linearGradient>
    <filter id="espShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#2d1409" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgEspresso)"/>

  <!-- Saucer (Platillo) -->
  <ellipse cx="150" cy="230" rx="90" ry="24" fill="#30180d" filter="url(#espShadow)"/>
  <ellipse cx="150" cy="226" rx="80" ry="18" fill="#4d2817"/>
  <ellipse cx="150" cy="225" rx="55" ry="12" fill="#29130a"/>

  <!-- Cup Handle -->
  <path d="M 195 145 C 235 145, 235 190, 195 190" stroke="url(#cupCeramic)" stroke-width="12" stroke-linecap="round" fill="none" filter="url(#espShadow)"/>

  <!-- Cup Body -->
  <g filter="url(#espShadow)">
    <path d="M 85 130 C 85 215, 215 215, 215 130 Z" fill="url(#cupCeramic)"/>
    <!-- Cup Rim -->
    <ellipse cx="150" cy="130" rx="65" ry="22" fill="#3a1c0e"/>
    <ellipse cx="150" cy="130" rx="58" ry="18" fill="#241007"/>
    
    <!-- Rich Espresso Crema Surface (Crema de avellana y notas tostadas) -->
    <ellipse cx="150" cy="132" rx="54" ry="16" fill="url(#crema)"/>

    <!-- Crema Tigrato Swirls & Microbubbles -->
    <path d="M 130 130 Q 150 124 170 134 Q 155 140 135 136" stroke="#f2b46d" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M 125 135 Q 145 140 165 130" stroke="#f2b46d" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7"/>
    <ellipse cx="142" cy="131" rx="4" ry="2" fill="#f8c98e" opacity="0.7"/>
    <ellipse cx="158" cy="135" rx="3" ry="1.5" fill="#f8c98e" opacity="0.6"/>
  </g>

  <!-- Coffee Beans on Saucer -->
  <g transform="translate(85, 215) rotate(-15) scale(0.7)">
    <ellipse cx="10" cy="10" rx="8" ry="11" fill="#2b1409"/>
    <path d="M 10 2 Q 8 10 10 18" stroke="#482210" stroke-width="1.5" fill="none"/>
  </g>
  <g transform="translate(195, 210) rotate(25) scale(0.65)">
    <ellipse cx="10" cy="10" rx="8" ry="11" fill="#2b1409"/>
    <path d="M 10 2 Q 12 10 10 18" stroke="#482210" stroke-width="1.5" fill="none"/>
  </g>
</svg>
