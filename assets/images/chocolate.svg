<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgChocCup" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8f3"/>
      <stop offset="100%" stop-color="#ecdcce"/>
    </radialGradient>
    <radialGradient id="hotChoc" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#4a2617"/>
      <stop offset="60%" stop-color="#33180c"/>
      <stop offset="100%" stop-color="#1d0c05"/>
    </radialGradient>
    <linearGradient id="ceramicMug" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0d6c8"/>
      <stop offset="30%" stop-color="#fdfcfb"/>
      <stop offset="70%" stop-color="#ece2d5"/>
      <stop offset="100%" stop-color="#cec0af"/>
    </linearGradient>
    <filter id="mugShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#2d1409" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgChocCup)"/>

  <!-- Saucer -->
  <ellipse cx="150" cy="235" rx="95" ry="26" fill="#e8dfd3" filter="url(#mugShadow)"/>
  <ellipse cx="150" cy="232" rx="85" ry="20" fill="#ffffff"/>

  <!-- Mug Handle -->
  <path d="M 205 125 C 248 125, 248 185, 205 185" stroke="url(#ceramicMug)" stroke-width="14" stroke-linecap="round" fill="none" filter="url(#mugShadow)"/>

  <!-- Ceramic Mug Body -->
  <g filter="url(#mugShadow)">
    <path d="M 80 115 C 80 215, 220 215, 220 115 Z" fill="url(#ceramicMug)"/>
    
    <!-- Mug Rim -->
    <ellipse cx="150" cy="115" rx="70" ry="24" fill="#e0d5c6"/>
    <ellipse cx="150" cy="115" rx="63" ry="20" fill="#2d1408"/>

    <!-- Thick Ganache Chocolate Surface (Ganache de cacao puro fundida) -->
    <ellipse cx="150" cy="118" rx="60" ry="18" fill="url(#hotChoc)"/>

    <!-- Cream swirl / cocoa powder dusting / Marshmallows -->
    <path d="M 125 120 C 135 110, 165 110, 175 122 C 165 130, 135 130, 125 120 Z" fill="#ffffff" opacity="0.85"/>
    <path d="M 135 118 Q 150 112 165 120" stroke="#33180c" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    
    <!-- Cocoa Nibs / Shaved Chocolate on top -->
    <polygon points="135,115 140,112 142,117" fill="#180702"/>
    <polygon points="152,112 158,110 156,115" fill="#180702"/>
    <polygon points="160,122 166,120 164,125" fill="#180702"/>
    <polygon points="142,124 148,122 146,127" fill="#180702"/>
    <polygon points="128,122 133,120 131,125" fill="#180702"/>

    <!-- Steam wisps -->
    <path d="M 135 90 Q 142 80 138 70" stroke="#bda086" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M 155 85 Q 163 75 158 65" stroke="#bda086" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>
</svg>
