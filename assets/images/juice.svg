<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgJuice" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbf2"/>
      <stop offset="100%" stop-color="#ecdcce"/>
    </radialGradient>
    <!-- Green Detox Juice (Bottle 1) -->
    <linearGradient id="greenJuice" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7cb342"/>
      <stop offset="50%" stop-color="#8bc34a"/>
      <stop offset="100%" stop-color="#558b2f"/>
    </linearGradient>
    <!-- Orange Citrus Juice (Bottle 2) -->
    <linearGradient id="orangeJuice" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="50%" stop-color="#ffa726"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="bottleGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="juiceShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#3c1d0b" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgJuice)"/>

  <!-- Ground Shadows -->
  <ellipse cx="110" cy="245" rx="35" ry="10" fill="#3c1d0b" opacity="0.15"/>
  <ellipse cx="190" cy="245" rx="35" ry="10" fill="#3c1d0b" opacity="0.15"/>

  <!-- Bottle 1: Green Cold Pressed Juice (Extracto Prensado Verde) -->
  <g filter="url(#juiceShadow)">
    <!-- Cap -->
    <rect x="98" y="70" width="24" height="15" fill="#333333" rx="2"/>
    <!-- Neck -->
    <path d="M 103 85 L 103 105 L 85 125 L 85 240 L 135 240 L 135 125 L 117 105 L 117 85 Z" fill="rgba(255, 255, 255, 0.4)"/>
    <!-- Liquid Content -->
    <path d="M 87 130 L 87 238 L 133 238 L 133 130 L 115 110 L 105 110 Z" fill="url(#greenJuice)"/>
    <!-- Label -->
    <rect x="88" y="150" width="44" height="50" fill="#ffffff" opacity="0.9" rx="3"/>
    <text x="110" y="168" font-family="sans-serif" font-size="7" font-weight="bold" fill="#33691e" text-anchor="middle">VERDE</text>
    <text x="110" y="178" font-family="sans-serif" font-size="5" fill="#558b2f" text-anchor="middle">COLD PRESSED</text>
    <line x1="96" y1="183" x2="124" y2="183" stroke="#8bc34a" stroke-width="1"/>
    <!-- Glass sheen -->
    <rect x="90" y="128" width="4" height="108" fill="#ffffff" opacity="0.6" rx="2"/>
  </g>

  <!-- Bottle 2: Orange / Citrus Cold Pressed Juice -->
  <g filter="url(#juiceShadow)">
    <!-- Cap -->
    <rect x="178" y="70" width="24" height="15" fill="#333333" rx="2"/>
    <!-- Neck -->
    <path d="M 183 85 L 183 105 L 165 125 L 165 240 L 215 240 L 215 125 L 197 105 L 197 85 Z" fill="rgba(255, 255, 255, 0.4)"/>
    <!-- Liquid Content -->
    <path d="M 167 130 L 167 238 L 213 238 L 213 130 L 195 110 L 185 110 Z" fill="url(#orangeJuice)"/>
    <!-- Label -->
    <rect x="168" y="150" width="44" height="50" fill="#ffffff" opacity="0.9" rx="3"/>
    <text x="190" y="168" font-family="sans-serif" font-size="7" font-weight="bold" fill="#e65100" text-anchor="middle">CÍTRICO</text>
    <text x="190" y="178" font-family="sans-serif" font-size="5" fill="#ef6c00" text-anchor="middle">100% NATURAL</text>
    <line x1="176" y1="183" x2="204" y2="183" stroke="#ffa726" stroke-width="1"/>
    <!-- Glass sheen -->
    <rect x="170" y="128" width="4" height="108" fill="#ffffff" opacity="0.6" rx="2"/>
  </g>
</svg>
