<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgAlfajor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="100%" stop-color="#eddac7"/>
    </radialGradient>
    <linearGradient id="tapaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5e1be"/>
      <stop offset="100%" stop-color="#d9ad74"/>
    </linearGradient>
    <linearGradient id="ddlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#994d11"/>
      <stop offset="50%" stop-color="#7a3605"/>
      <stop offset="100%" stop-color="#542100"/>
    </linearGradient>
    <filter id="alfShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#3c1d0b" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgAlfajor)"/>

  <!-- Alfajor 1 (Left background) -->
  <g filter="url(#alfShadow)" transform="translate(-30, -20) scale(0.85)">
    <ellipse cx="140" cy="180" rx="70" ry="25" fill="url(#tapaGrad)"/>
    <path d="M 70 160 C 70 140, 210 140, 210 160 L 210 175 L 70 175 Z" fill="url(#ddlGrad)"/>
    <ellipse cx="140" cy="150" rx="70" ry="25" fill="url(#tapaGrad)"/>
  </g>

  <!-- Alfajor 2 (Main Foreground) -->
  <g filter="url(#alfShadow)">
    <!-- Bottom Cookie Cap -->
    <path d="M 75 185 C 75 205, 225 205, 225 185 L 225 175 L 75 175 Z" fill="#c49354"/>
    <ellipse cx="150" cy="175" rx="75" ry="24" fill="url(#tapaGrad)"/>

    <!-- Dulce de Leche Thick Layer (Relleno abundante) -->
    <path d="M 72 155 C 70 175, 228 175, 228 155 L 228 172 C 228 190, 72 190, 72 172 Z" fill="url(#ddlGrad)"/>

    <!-- Shredded Coconut Border (Coco rallado) -->
    <!-- Coconut flakes all along middle edge -->
    <g fill="#ffffff" opacity="0.95">
      <ellipse cx="78" cy="165" rx="3" ry="1.5" transform="rotate(15 78 165)"/>
      <ellipse cx="88" cy="168" rx="4" ry="1.8" transform="rotate(-20 88 168)"/>
      <ellipse cx="98" cy="170" rx="3.5" ry="1.5" transform="rotate(35 98 170)"/>
      <ellipse cx="110" cy="172" rx="4" ry="1.5"/>
      <ellipse cx="122" cy="173" rx="3.5" ry="1.8" transform="rotate(-15 122 173)"/>
      <ellipse cx="135" cy="174" rx="4.5" ry="1.5" transform="rotate(25 135 174)"/>
      <ellipse cx="148" cy="174" rx="3.8" ry="1.8"/>
      <ellipse cx="160" cy="173" rx="4" ry="1.5" transform="rotate(-30 160 173)"/>
      <ellipse cx="174" cy="172" rx="3.5" ry="1.6" transform="rotate(10 174 172)"/>
      <ellipse cx="188" cy="170" rx="4" ry="1.8" transform="rotate(-20 188 170)"/>
      <ellipse cx="202" cy="167" rx="3.5" ry="1.5" transform="rotate(25 202 167)"/>
      <ellipse cx="215" cy="163" rx="4" ry="1.6" transform="rotate(-15 215 163)"/>
      <ellipse cx="222" cy="158" rx="3" ry="1.4"/>
      <!-- Second row of flakes -->
      <ellipse cx="84" cy="161" rx="3.5" ry="1.5" transform="rotate(45 84 161)"/>
      <ellipse cx="104" cy="164" rx="4" ry="1.5" transform="rotate(-10 104 164)"/>
      <ellipse cx="130" cy="167" rx="3.5" ry="1.8" transform="rotate(30 130 167)"/>
      <ellipse cx="155" cy="167" rx="4" ry="1.5" transform="rotate(-25 155 167)"/>
      <ellipse cx="180" cy="165" rx="3.5" ry="1.7" transform="rotate(15 180 165)"/>
      <ellipse cx="208" cy="161" rx="4" ry="1.5" transform="rotate(-35 208 161)"/>
    </g>

    <!-- Top Cookie Cap -->
    <path d="M 75 145 C 75 165, 225 165, 225 145 L 225 135 C 225 115, 75 115, 75 135 Z" fill="#b88340"/>
    <ellipse cx="150" cy="132" rx="75" ry="24" fill="url(#tapaGrad)"/>

    <!-- Powdered Sugar Dusting / Cocoa dust -->
    <ellipse cx="150" cy="132" rx="60" ry="18" fill="#ffffff" opacity="0.45"/>
    <circle cx="130" cy="128" r="8" fill="#ffffff" opacity="0.3"/>
    <circle cx="165" cy="134" r="10" fill="#ffffff" opacity="0.3"/>
  </g>
</svg>
