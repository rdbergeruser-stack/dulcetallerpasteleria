<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgMuffin" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="100%" stop-color="#eddac6"/>
    </radialGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9b195"/>
      <stop offset="25%" stop-color="#f5e8d7"/>
      <stop offset="50%" stop-color="#ded0bd"/>
      <stop offset="75%" stop-color="#f5e8d7"/>
      <stop offset="100%" stop-color="#bda080"/>
    </linearGradient>
    <radialGradient id="muffinTop" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffdfa9"/>
      <stop offset="50%" stop-color="#d99f57"/>
      <stop offset="85%" stop-color="#a66524"/>
      <stop offset="100%" stop-color="#733d0e"/>
    </radialGradient>
    <filter id="muffShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#3c1d0b" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgMuffin)"/>

  <!-- Left Background Muffin -->
  <g filter="url(#muffShadow)" transform="translate(-40, -10) scale(0.85)">
    <!-- Cup -->
    <path d="M 115 160 L 125 220 L 175 220 L 185 160 Z" fill="url(#cupGrad)"/>
    <!-- Muffin Top -->
    <path d="M 95 160 C 90 120, 210 120, 205 160 Z" fill="url(#muffinTop)"/>
  </g>

  <!-- Right Background Muffin -->
  <g filter="url(#muffShadow)" transform="translate(45, -10) scale(0.85)">
    <!-- Cup -->
    <path d="M 115 160 L 125 220 L 175 220 L 185 160 Z" fill="url(#cupGrad)"/>
    <!-- Muffin Top -->
    <path d="M 95 160 C 90 120, 210 120, 205 160 Z" fill="url(#muffinTop)"/>
  </g>

  <!-- Foreground Main Muffin -->
  <g filter="url(#muffShadow)">
    <!-- Paper Cup with pleats -->
    <path d="M 105 170 L 120 240 L 180 240 L 195 170 Z" fill="url(#cupGrad)"/>
    <!-- Cup Pleat Lines -->
    <path d="M 115 170 L 127 240 M 130 170 L 138 240 M 145 170 L 148 240 M 160 170 L 158 240 M 175 170 L 168 240 M 188 170 L 176 240" stroke="#a68c70" stroke-width="1.2" opacity="0.6"/>

    <!-- Fluffy Golden Muffin Dome Top (Corona crujiente) -->
    <path d="M 80 170 C 75 110, 225 110, 220 170 C 225 182, 75 182, 80 170 Z" fill="url(#muffinTop)"/>

    <!-- Crackles / Fissures on Crown -->
    <path d="M 120 140 Q 145 130 170 145" stroke="#63320a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 140 125 Q 155 140 150 155" stroke="#63320a" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 105 155 Q 120 150 130 160" stroke="#783e0c" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 165 155 Q 180 145 195 160" stroke="#783e0c" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Vanilla bean specks & sugar crystals -->
    <circle cx="130" cy="135" r="1.5" fill="#381a04"/>
    <circle cx="160" cy="138" r="1.5" fill="#381a04"/>
    <circle cx="145" cy="148" r="1.5" fill="#381a04"/>
    <circle cx="115" cy="150" r="1.2" fill="#381a04"/>
    <circle cx="180" cy="150" r="1.2" fill="#381a04"/>
    
    <!-- Coarse crystal sugar sparkle on top -->
    <circle cx="135" cy="120" r="2" fill="#ffffff" opacity="0.8"/>
    <circle cx="155" cy="122" r="2" fill="#ffffff" opacity="0.8"/>
    <circle cx="145" cy="115" r="2.5" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
