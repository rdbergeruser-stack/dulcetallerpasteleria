<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgCookie" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffaf2"/>
      <stop offset="100%" stop-color="#f0e0d0"/>
    </radialGradient>
    <radialGradient id="cookieDough" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e8b97d"/>
      <stop offset="60%" stop-color="#cf9451"/>
      <stop offset="100%" stop-color="#965c20"/>
    </radialGradient>
    <filter id="cookieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#40200d" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgCookie)"/>

  <!-- Back Cookie (Stacked underneath) -->
  <g filter="url(#cookieShadow)" transform="translate(-15, -15)">
    <ellipse cx="140" cy="140" rx="75" ry="60" fill="url(#cookieDough)"/>
    <!-- Choc chips -->
    <path d="M 110 115 Q 120 110 125 120 Q 115 130 110 115 Z" fill="#241105"/>
    <path d="M 145 105 Q 155 100 160 112 Q 150 120 145 105 Z" fill="#241105"/>
    <path d="M 160 135 Q 170 130 172 142 Q 162 150 160 135 Z" fill="#241105"/>
  </g>

  <!-- Front Cookie -->
  <g filter="url(#cookieShadow)">
    <ellipse cx="160" cy="165" rx="85" ry="68" fill="url(#cookieDough)"/>
    
    <!-- Dough fissures & cracks -->
    <path d="M 120 145 Q 140 155 135 175" stroke="#7e4513" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 170 135 Q 185 150 200 145" stroke="#7e4513" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 155 175 Q 175 190 190 180" stroke="#7e4513" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Chocolate Chips / Chunks -->
    <path d="M 115 160 Q 128 152 132 165 Q 122 178 115 160 Z" fill="#241105"/>
    <ellipse cx="123" cy="160" rx="4" ry="2" fill="#4d2c16" opacity="0.6"/>
    
    <path d="M 150 130 Q 165 125 168 140 Q 155 148 150 130 Z" fill="#241105"/>
    <ellipse cx="158" cy="132" rx="4" ry="2" fill="#4d2c16" opacity="0.6"/>

    <path d="M 185 155 Q 200 148 202 162 Q 190 172 185 155 Z" fill="#241105"/>
    <ellipse cx="192" cy="156" rx="4" ry="2" fill="#4d2c16" opacity="0.6"/>

    <path d="M 140 185 Q 155 178 160 192 Q 148 200 140 185 Z" fill="#241105"/>
    
    <path d="M 175 195 Q 185 190 188 200 Q 178 205 175 195 Z" fill="#241105"/>

    <!-- Sea Salt flakes on top -->
    <rect x="135" y="145" width="4" height="2" fill="#ffffff" opacity="0.85" rx="1"/>
    <rect x="170" y="165" width="5" height="3" fill="#ffffff" opacity="0.85" rx="1"/>
    <rect x="150" y="170" width="3" height="3" fill="#ffffff" opacity="0.85" rx="1"/>
  </g>
</svg>
